name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: /tmp/npm-cache

      - name: Install platform-specific sherpa-onnx
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm install sherpa-onnx-darwin-arm64 sherpa-onnx-darwin-x64 --no-save
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npm install sherpa-onnx-win-x64 --no-save
          else
            npm install sherpa-onnx-linux-x64 --no-save
          fi

      - name: Build
        run: npx electron-vite build

      - name: Package (electron-builder)
        run: npx electron-builder --${{ matrix.os == 'macos-latest' && 'mac' || matrix.os == 'windows-latest' && 'win' || 'linux' }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist/*.{dmg,zip,exe,AppImage,deb}
          if-no-files-found: ignore
