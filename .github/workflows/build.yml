name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install platform-specific sherpa-onnx
        shell: bash
        run: |
          ARCH=$(node -e "console.log(process.arch)")
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm install "sherpa-onnx-darwin-${ARCH}" --no-save 2>/dev/null || true
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npm install sherpa-onnx-win-x64 --no-save 2>/dev/null || true
          else
            npm install sherpa-onnx-linux-x64 --no-save 2>/dev/null || true
          fi

      - name: Build
        run: npx electron-vite build

      - name: Package (electron-builder)
        run: npx electron-builder --${{ matrix.os == 'macos-latest' && 'mac' || matrix.os == 'windows-latest' && 'win' || 'linux' }} --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/win-unpacked/*.exe
          if-no-files-found: warn
